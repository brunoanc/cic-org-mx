<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="CIC">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
        html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-size: min(clamp(0.75rem, 1.5vw + 0.1875rem, 1.5rem), 2.5vh);
        }

        body {
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body:has(main.body-index-style) {
            margin-top: 0;
        }

        @media screen and (min-width: 821px) {
            body {
                margin-top: 13.5vh;
                min-height: calc(100vh - 13.5vh);
            }
        }

        @media screen and (max-width: 820px) {
            body {
                margin-top: 8vh;
                min-height: calc(100vh - 8vh);
            }
        }

        figure {
            margin: 0;
        }

        i {
            text-rendering: optimizeLegibility;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-delay: 0ms !important;
                animation-duration: 1ms !important;
            }
        }

        @property --pink-color {
            syntax: "<color>";
            inherits: false;
            initial-value: #9F326B;
        }

        @property --blue-color {
            syntax: "<color>";
            inherits: false;
            initial-value: #07446E;
        }
    </style>

    %sveltekit.head%
</head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">
            %sveltekit.body%
        </div>
    </body>
</html>
